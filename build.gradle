plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.nirvana'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // BOM (Bill of Materials) - 의존성 버전 일괄 관리
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
    compileOnly platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    // =========================================================================
    // Spring Boot & Spring Cloud - 웹 API, 모니터링, 중앙 설정
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'     // Spring MVC 기반 REST API와 웹 서버
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // 헬스체크, 메트릭 등 운영 상태 확인
    implementation 'org.springframework.cloud:spring-cloud-starter-config'  // Config Server에서 서비스 설정 가져오기
    // =========================================================================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // API 문서화 - OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'  // OpenAPI 문서 생성 및 Swagger UI 제공
    // =========================================================================
    // 반복 코드 줄이기 - Lombok
    compileOnly 'org.projectlombok:lombok'                                   // 컴파일할 때 Lombok 애너테이션 사용
    annotationProcessor 'org.projectlombok:lombok'                           // 컴파일 중 Getter, Setter, Builder 등 생성
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def snippetsDir = layout.buildDirectory.dir('generated-snippets')

tasks.named('test') {
    useJUnitPlatform()
    outputs.dir(snippetsDir)
}

def restDocs = tasks.register('restDocs') {
    group = 'documentation'
    description = 'Assembles API contract examples generated by Spring REST Docs.'
    dependsOn(tasks.named('test'))
    inputs.dir(snippetsDir)
    def document = layout.buildDirectory.file('docs/member-api.md')
    outputs.file(document)
    doLast {
        def scenarios = [
            'created': '201 프로필 생성',
            'validation-failed': '400 입력값 검증 실패',
            'invalid-country-code': '400 지원하지 않는 국가 코드',
            'authentication-required': '401 서비스 인증 실패',
            'profile-already-exists': '409 같은 UUID의 프로필 존재',
            'nickname-taken': '409 닉네임 중복',
            'internal-error': '500 서버 오류',
            'read-found': '200 프로필 조회',
            'read-invalid-uuid': '400 프로필 조회 UUID 형식 오류',
            'read-authentication-required': '401 프로필 조회 서비스 인증 실패',
            'read-not-found': '404 활성 프로필 없음'
        ]
        def sections = scenarios.collect { scenario, heading ->
            def directory = snippetsDir.get().dir("profiles/$scenario")
            def request = directory.file('http-request.md').asFile.getText('UTF-8')
            def response = directory.file('http-response.md').asFile.getText('UTF-8')
            "## $heading\n\n### 요청\n\n$request\n\n### 응답\n\n$response"
        }
        def output = document.get().asFile
        output.parentFile.mkdirs()
        output.setText("# 일반 회원 프로필 API\n\n" + sections.join('\n\n'), 'UTF-8')
    }
}

tasks.named('check') {
    dependsOn(restDocs)
}
