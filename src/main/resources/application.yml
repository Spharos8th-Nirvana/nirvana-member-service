server:
  port: ${SERVER_PORT:8082}

member:
  profile-events:
    topic: ${AUTH_USER_TOPIC:nirvana.auth.user}
    completed-topic: ${MEMBER_PROFILE_COMPLETED_TOPIC:nirvana.member.profile-created}
    group-id: ${MEMBER_PROFILE_EVENT_GROUP_ID:member-profile-creation}

spring:
  application:
    name: member-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[max.block.ms]": 2000
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 6000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/nirvana_member
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  profiles:
    default: local
  cloud:
    config:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: config-server
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
